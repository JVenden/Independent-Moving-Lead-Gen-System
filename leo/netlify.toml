[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Demo mode: sample prospects, quotes work, nothing is saved or sent, /admin needs no password.
  # To go live: delete the next line and add the variables from .env.example in Netlify.
  NEXT_PUBLIC_DEMO_MODE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
